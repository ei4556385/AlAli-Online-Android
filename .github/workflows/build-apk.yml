name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/alalionline/app app/src/main/assets app/src/main/res/values app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AlAliOnline"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.alalionline.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.alalionline.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file('alali.p12')
                      storePassword 'alali2026'
                      keyAlias 'alali'
                      keyPassword 'alali2026'
                      storeType 'pkcs12'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">آل علي أونلاين</string>
          </resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/assets/offline.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>غير متصل</title>
          <style>
            *{margin:0;padding:0;box-sizing:border-box}
            body{background:#050811;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#E2E8F0;text-align:center;padding:24px}
            .icon{font-size:56px;margin-bottom:16px}
            h1{font-size:20px;margin-bottom:10px}
            p{color:#94A3B8;font-size:14px;margin-bottom:28px;line-height:1.7}
            button{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;border:none;padding:13px 40px;border-radius:12px;font-size:15px;font-weight:600}
          </style>
          </head>
          <body>
            <div>
              <div class="icon">📡</div>
              <h1>لا يوجد اتصال بالإنترنت</h1>
              <p>تأكد من اتصالك بالإنترنت وحاول مرة أخرى</p>
              <button onclick="window.location.href='https://dremeduf.lovestoblog.com/login.php'">إعادة المحاولة</button>
            </div>
          </body>
          </html>
          EOF
          cat > app/src/main/java/com/alalionline/app/MainActivity.java <<'EOF'
          package com.alalionline.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {

              private static final String HOST = "dremeduf.lovestoblog.com";
              private static final String START_URL = "https://" + HOST + "/login.php";

              private FrameLayout root;
              private WebView webView;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // أهم سطر في التطبيق: يمنع الاسكرين شوت وتسجيل الشاشة والبث ولقطة التطبيقات الأخيرة
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE);
                  // الشاشة تفضل منورة أثناء مشاهدة الدرس
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);
                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  // علامة تخلي الموقع يعرف إن الطالب فاتح من التطبيق
                  s.setUserAgentString(s.getUserAgentString() + " AlAliApp/1.0");

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  // منع قائمة الضغط المطول (نسخ / مشاركة)
                  webView.setLongClickable(false);
                  webView.setHapticFeedbackEnabled(false);
                  webView.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) { return true; }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) return false;
                          Uri u = request.getUrl();
                          String scheme = u.getScheme();
                          if ("file".equals(scheme)) return false;
                          if ("https".equals(scheme) && HOST.equals(u.getHost())) return false;
                          return true; // امنع أي خروج من موقع المنصة
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              view.loadUrl("file:///android_asset/offline.html");
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          enterFullscreen(view, callback);
                      }

                      @Override
                      public void onHideCustomView() {
                          exitFullscreen();
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.deny(); // لا كاميرا ولا مايك ولا مشاركة شاشة
                      }
                  });

                  webView.loadUrl(START_URL);
              }

              @SuppressWarnings("deprecation")
              private void setImmersive(boolean on) {
                  int flags = on
                          ? (View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN)
                          : View.SYSTEM_UI_FLAG_VISIBLE;
                  getWindow().getDecorView().setSystemUiVisibility(flags);
              }

              // تكبير الفيديو: يتحول أفقي تلقائياً والعلامة المائية تفضل ظاهرة
              private void enterFullscreen(View view, WebChromeClient.CustomViewCallback callback) {
                  if (customView != null) {
                      callback.onCustomViewHidden();
                      return;
                  }
                  customView = view;
                  customViewCallback = callback;
                  webView.setVisibility(View.GONE);
                  root.addView(view, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  setImmersive(true);
              }

              private void exitFullscreen() {
                  if (customView == null) return;
                  root.removeView(customView);
                  customView = null;
                  if (customViewCallback != null) {
                      customViewCallback.onCustomViewHidden();
                      customViewCallback = null;
                  }
                  webView.setVisibility(View.VISIBLE);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  setImmersive(false);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (customView != null) {
                      exitFullscreen();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  webView.onPause();
                  CookieManager.getInstance().flush(); // يحفظ الكوكيز (ومنها كوكي ربط الجهاز)
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  root.removeAllViews();
                  webView.destroy();
                  super.onDestroy();
              }
          }
          EOF
          echo "" | base64 -d > app/alali.p12
          echo "" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlAli-Online-APK
          path: app/build/outputs/apk/release/*.apk
